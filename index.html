<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Glitching Tales</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Three.js Canvas Container -->
        <div id="canvas-container"></div>

        <!-- UI Overlay -->
        <div id="ui-layer">
            <div id="cinematic-bar-top" class="cinematic-bar"></div>
            <div id="cinematic-bar-bottom" class="cinematic-bar"></div>

            <div id="dialogue-box" class="hidden">
                <div class="speaker-name">Name</div>
                <div class="dialogue-text">Dialogue goes here...</div>
                <div class="dialogue-indicator">▼</div>
            </div>

            <!-- Player HUD: HP / MP / Stamina / Weapon / Coins -->
            <div id="player-hud">
                <div class="hud-row"><span class="hud-label">HP</span><div class="hud-bar"><div id="hud-hp-fill" class="hud-fill hud-hp"></div></div></div>
                <div class="hud-row"><span class="hud-label">MP</span><div class="hud-bar"><div id="hud-mp-fill" class="hud-fill hud-mp"></div></div></div>
                <div class="hud-row"><span class="hud-label">STA</span><div class="hud-bar"><div id="hud-stamina-fill" class="hud-fill hud-stamina"></div></div></div>
                <div class="hud-row"><span id="hud-level">Lv.1</span> <span id="hud-weapon-name">Weapon</span> <span>💰<span id="hud-coins">0</span></span></div>
            </div>

            <!-- Boss health bar (shown during Croton's fight) -->
            <div id="boss-health-container" class="hidden">
                <div id="boss-name">Croton, King of Crabs</div>
                <div class="boss-bar-fill" id="boss-health-fill"></div>
            </div>
        </div>

        <!-- Mobile Controls Overlay (Hidden by default via CSS) -->
        <div id="mobile-controls" class="hidden">
            <div class="d-pad">
                <div class="d-btn d-up" id="btn-up">▲</div>
                <div class="d-btn d-left" id="btn-left">◀</div>
                <div class="d-btn d-right" id="btn-right">▶</div>
                <div class="d-btn d-down" id="btn-down">▼</div>
            </div>
            <div class="action-buttons">
                <div class="action-btn-mobile btn-b" id="btn-swap">ATTACK</div>
                <div class="action-btn-mobile btn-a" id="btn-jump">JUMP</div>
            </div>
            <div id="touch-pad-zone"></div>
        </div>

        <!-- Main Menu -->
        <div id="main-menu" class="overlay-screen cool-bg">
            <div class="menu-content glass-panel">
                <div class="logo-container">
                    <h1 class="game-title glitch-effect">THE GLITCHING</h1>
                    <h2 class="game-subtitle">TALES</h2>
                </div>
                <div class="menu-buttons">
                    <button id="start-btn" class="primary-btn pulse-anim">
                        <span class="btn-text">START ADVENTURE</span>
                        <div class="btn-glow"></div>
                    </button>
                    <button id="menu-settings-btn" class="secondary-btn" style="margin-top: 15px;">
                        ⚙️ SETTINGS
                    </button>
                    <button id="difficulty-btn" class="secondary-btn" style="margin-top: 15px; border-color: #ff4757; color: #ff4757;">
                        🔥 DIFFICULTY: HARD
                    </button>
                </div>
                <div class="version-tag">v3.0 - The Emerald Coast</div>
            </div>
        </div>

        <!-- Character Creation -->
        <div id="character-creation-ui" class="overlay-screen cool-bg hidden">
            <div class="menu-content glass-panel">
                <h2 class="game-subtitle">WHO ARE YOU?</h2>
                <div class="setting-row">
                    <label>Name</label>
                    <input type="text" id="cc-name-input" maxlength="20" placeholder="Traveler" style="padding:8px; border-radius:6px; border:none;">
                </div>
                <div class="setting-row">
                    <label>Body Color</label>
                    <input type="color" id="cc-body-color" value="#e8b98a">
                </div>
                <div class="setting-row">
                    <label>Outfit Color</label>
                    <input type="color" id="cc-outfit-color" value="#3b6ea5">
                </div>
                <div class="cc-skill-grid">
                    <button class="cc-skill-btn secondary-btn" data-skill="magick">MAGICK</button>
                    <button class="cc-skill-btn secondary-btn" data-skill="melee">MELEE</button>
                    <button class="cc-skill-btn secondary-btn" data-skill="range">RANGE</button>
                </div>
                <p id="cc-skill-desc" style="min-height: 2.5em;"></p>
                <button id="cc-confirm-btn" class="primary-btn pulse-anim" style="margin-top: 15px;">
                    <span class="btn-text">BEGIN ADVENTURE</span>
                    <div class="btn-glow"></div>
                </button>
            </div>
        </div>

        <!-- Chapter End Screen -->
        <div id="chapter-end-ui" class="overlay-screen cool-bg hidden">
            <div class="menu-content glass-panel">
                <h2 class="game-subtitle">Chapter 3</h2>
                <h1 class="game-title glitch-effect" style="font-size: 2rem;">DUNES OF FORCE</h1>
                <p>Coming Soon!</p>
                <button id="chapter-end-menu-btn" class="primary-btn" style="margin-top: 20px;">
                    <span class="btn-text">BACK TO MAIN MENU</span>
                    <div class="btn-glow"></div>
                </button>
            </div>
        </div>

        <!-- Shop UI overlay -->
        <div id="shop-ui" class="overlay-screen hidden">
            <div class="shop-container">
                <div class="shop-header">
                    <h2 id="shop-title">Shop</h2>
                    <div class="coin-display">💰 <span id="coin-count">0</span></div>
                </div>
                <div class="shop-body">
                    <div class="shopkeeper-portrait">
                        <p id="shopkeeper-dialogue">"Welcome to my shop! Have a look around."</p>
                    </div>
                    <div class="shop-items-grid" id="shop-items-grid">
                        <!-- Items injected here -->
                    </div>
                </div>
                <div class="shop-footer">
                    <button id="close-shop-btn" class="secondary-btn">Leave</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <!-- Settings UI -->
    <div id="settings-ui" class="hidden fullscreen-ui settings-bg">
        <div class="settings-panel">
            <button id="close-settings-btn" class="close-btn">X</button>
            <h2>SETTINGS</h2>

            <div class="setting-row">
                <label>Volume</label>
                <input type="range" id="volume-slider" min="0" max="100" value="50">
            </div>

            <div class="setting-row">
                <label>Invincible Mode</label>
                <label class="switch">
                    <input type="checkbox" id="invincible-toggle">
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="setting-row">
                <label>Mirror Mode</label>
                <label class="switch">
                    <input type="checkbox" id="mirror-toggle">
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="setting-row">
                <label>Theme Color</label>
                <input type="color" id="theme-color-picker" value="#fbbf24">
            </div>
        </div>
    </div>

    <!-- Pause UI -->
    <div id="pause-ui" class="hidden fullscreen-ui pause-bg">
        <div class="settings-panel">
            <button id="resume-btn" class="close-btn">X</button>
            <h2>PAUSED</h2>

            <div class="setting-row">
                <label>Volume</label>
                <input type="range" id="pause-volume-slider" min="0" max="100" value="50">
            </div>

            <div class="setting-row">
                <label>Invincible Mode</label>
                <label class="switch">
                    <input type="checkbox" id="pause-invincible-toggle">
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="setting-row">
                <label>Mirror Mode</label>
                <label class="switch">
                    <input type="checkbox" id="pause-mirror-toggle">
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="setting-row">
                <label>Theme Color</label>
                <input type="color" id="pause-theme-color-picker" value="#fbbf24">
            </div>

            <button id="moveset-guide-btn" class="secondary-btn" style="margin-top:10px; width:100%;">Moveset Guide</button>
            <button id="resume-main-btn" class="buy-btn" style="margin-top:20px; width:100%;">Resume Game</button>
        </div>
    </div>

    <!-- Moveset Guide Modal -->
    <div id="moveset-modal" class="hidden fullscreen-ui settings-bg" style="z-index: 4000;">
        <div class="settings-panel" style="width: 600px; max-height: 80vh; overflow-y: auto;">
            <button id="close-moveset-btn" class="close-btn">X</button>
            <h2>MOVESET GUIDE</h2>
            <div id="moveset-content" style="text-align: left; padding: 10px;">
                <!-- Moveset data injected here -->
            </div>
        </div>
    </div>

    <script src="js/voxel.js"></script>
    <script src="js/models3d.js"></script>
    <script src="js/combat3d.js"></script>
    <script src="js/overworld3d.js"></script>
    <script src="js/charactercreation.js"></script>
    <script src="js/main3d.js"></script>
</body>
</html>
