<!DOCTYPE html>
<html lang="en">
<head>
<script>
window.onerror = function(message, source, lineno, colno, error) {
    fetch('http://localhost:8081/log', {
        method: 'POST',
        body: JSON.stringify({type: 'error', message, source, lineno, colno, stack: error ? error.stack : ''})
    });
};
window.addEventListener('unhandledrejection', function(event) {
    fetch('http://localhost:8081/log', {
        method: 'POST',
        body: JSON.stringify({type: 'promise_rejection', reason: event.reason ? event.reason.stack || event.reason : 'Unknown'})
    });
});
const originalConsoleError = console.error;
console.error = function(...args) {
    fetch('http://localhost:8081/log', {
        method: 'POST',
        body: JSON.stringify({type: 'console_error', args: args.map(String)})
    });
    originalConsoleError.apply(console, args);
};
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Glitching Tales</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Three.js Canvas Container -->
        <div id="canvas-container"></div>
        
        <!-- UI Overlay -->
        <div id="ui-layer">
            <div id="cinematic-bar-top" class="cinematic-bar"></div>
            <div id="cinematic-bar-bottom" class="cinematic-bar"></div>
            
            <div id="dialogue-box" class="hidden">
                <div class="speaker-name">Name</div>
                <div class="dialogue-text">Dialogue goes here...</div>
                <div class="dialogue-indicator">▼</div>
            </div>
            
            <div id="key-tracker" class="hidden" style="position: absolute; top: 10px; left: 10px; display: flex; gap: 10px; z-index: 100; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; border: 2px solid gold;">
                <!-- Key icons injected here via JS -->
            </div>
        </div>

        <!-- Video Cutscene Layer -->
        <div id="video-layer" class="hidden overlay-screen" style="z-index: 200; background: black;">
            <video id="cutscene-video" class="fullscreen-video" style="width: 100%; height: 100%; object-fit: contain;"></video>
            <button id="skip-video-btn" class="skip-btn" style="position: absolute; bottom: 30px; right: 30px; padding: 10px 20px; font-family: 'Outfit'; font-weight: bold; font-size: 1.2rem; background: rgba(0,0,0,0.5); color: white; border: 2px solid white; border-radius: 8px; cursor: pointer; z-index: 201; text-transform: uppercase;">Skip Video</button>
        </div>


        <!-- Mobile Controls Overlay (Hidden by default via CSS) -->
        <div id="mobile-controls" class="hidden">
            <div class="d-pad">
                <div class="d-btn d-up" id="btn-up">▲</div>
                <div class="d-btn d-left" id="btn-left">◀</div>
                <div class="d-btn d-right" id="btn-right">▶</div>
                <div class="d-btn d-down" id="btn-down">▼</div>
            </div>
            <div class="action-buttons">
                <div class="action-btn-mobile btn-b" id="btn-swap">SWAP</div>
                <div class="action-btn-mobile btn-a" id="btn-jump">JUMP</div>
            </div>
            <div id="touch-pad-zone"></div>
        </div>

        <!-- Combat UI Layer (Overlays the 3D Combat Scene) -->
        <div id="combat-ui-layer" class="hidden">
            <!-- Boss Health Bar -->
            <div id="boss-health-container" class="hidden">
                <div id="boss-name">Corrupted Bowser</div>
                <div class="boss-bar-fill" id="boss-health-fill"></div>
            </div>
            
            <div class="combat-ui">
                <div class="party-status" id="party-status">
                    <!-- Character stats will go here -->
                </div>
                <div class="action-menu" id="action-menu">
                    <!-- Action buttons injected here -->
                </div>
            </div>
            <!-- Message overlay in combat -->
            <div id="combat-message" class="hidden"></div>
        </div>
        
        <!-- Main Menu -->
        <div id="main-menu" class="overlay-screen cool-bg">
            <div class="menu-content glass-panel">
                <div class="logo-container">
                    <h1 class="game-title glitch-effect">THE GLITCHING</h1>
                    <h2 class="game-subtitle">TALES</h2>
                </div>
                <div class="menu-buttons">
                    <button id="start-btn" class="primary-btn pulse-anim">
                        <span class="btn-text">START ADVENTURE</span>
                        <div class="btn-glow"></div>
                    </button>
                    <button id="tutorial-btn" class="primary-btn" style="margin-top: 15px;">
                        <span class="btn-text">PLAY TUTORIAL</span>
                        <div class="btn-glow"></div>
                    </button>
                    <button id="menu-settings-btn" class="secondary-btn" style="margin-top: 15px;">
                        ⚙️ SETTINGS
                    </button>
                    <button id="difficulty-btn" class="secondary-btn" style="margin-top: 15px; border-color: #ff4757; color: #ff4757;">
                        🔥 DIFFICULTY: HARD
                    </button>
                </div>
                <div class="version-tag">v2.0 Overhaul</div>
            </div>
        </div>
        <!-- Shop UI overlay -->
        <div id="shop-ui" class="overlay-screen hidden">
            <div class="shop-container">
                <div class="shop-header">
                    <h2 id="shop-title">Shop</h2>
                    <div class="coin-display">💰 <span id="coin-count">0</span></div>
                </div>
                <div class="shop-body">
                    <div class="shopkeeper-portrait">
                        <img id="shopkeeper-img" src="" alt="Shopkeeper">
                        <p id="shopkeeper-dialogue">"Welcome to my shop! Have a look around."</p>
                    </div>
                    <div class="shop-items-grid" id="shop-items-grid">
                        <!-- Items injected here -->
                    </div>
                </div>
                <div class="shop-footer">
                    <button id="close-shop-btn" class="secondary-btn">Leave</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <!-- Game Scripts -->
        <div id="bounty-ui" class="hidden">
            <div class="bounty-panel">
                <button id="close-bounty-btn" class="close-btn">X</button>
                <div class="bounty-header">
                    <h2 id="bounty-title">BOUNTY BOARD</h2>
                </div>
                <div class="bounty-content">
                    <h3 id="current-quest-title">No Active Quest</h3>
                    <p id="current-quest-desc">Talk to the Quest Master to receive a new bounty.</p>
                    <div id="quest-progress" class="quest-progress">0 / 0</div>
                    <button id="accept-quest-btn" class="buy-btn">Accept New Bounty</button>
                    <button id="claim-quest-btn" class="buy-btn hidden">Claim Reward!</button>
                </div>
            </div>
        </div>

        <!-- Settings UI -->
        <div id="settings-ui" class="hidden fullscreen-ui settings-bg">
            <div class="settings-panel">
                <button id="close-settings-btn" class="close-btn">X</button>
                <h2>SETTINGS</h2>
                
                <div class="setting-row">
                    <label>Volume</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="50">
                </div>
                
                <div class="setting-row">
                    <label>Invincible Mode</label>
                    <label class="switch">
                        <input type="checkbox" id="invincible-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <div class="setting-row">
                    <label>Mirror Mode</label>
                    <label class="switch">
                        <input type="checkbox" id="mirror-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <div class="setting-row">
                    <label>Theme Color</label>
                    <input type="color" id="theme-color-picker" value="#fbbf24">
                </div>
            </div>
        </div>

        <!-- Pause UI -->
        <div id="pause-ui" class="hidden fullscreen-ui pause-bg">
            <div class="settings-panel">
                <button id="resume-btn" class="close-btn">X</button>
                <h2>PAUSED</h2>
                
                <div class="setting-row">
                    <label>Volume</label>
                    <input type="range" id="pause-volume-slider" min="0" max="100" value="50">
                </div>
                
                <div class="setting-row">
                    <label>Invincible Mode</label>
                    <label class="switch">
                        <input type="checkbox" id="pause-invincible-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <div class="setting-row">
                    <label>Mirror Mode</label>
                    <label class="switch">
                        <input type="checkbox" id="pause-mirror-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <div class="setting-row">
                    <label>Theme Color</label>
                    <input type="color" id="pause-theme-color-picker" value="#fbbf24">
                </div>
                
                <button id="moveset-guide-btn" class="secondary-btn" style="margin-top:10px; width:100%;">Moveset Guide</button>
                <button id="resume-main-btn" class="buy-btn" style="margin-top:20px; width:100%;">Resume Game</button>
            </div>
        </div>

        <!-- Moveset Guide Modal -->
        <div id="moveset-modal" class="hidden fullscreen-ui settings-bg" style="z-index: 4000;">
            <div class="settings-panel" style="width: 600px; max-height: 80vh; overflow-y: auto;">
                <button id="close-moveset-btn" class="close-btn">X</button>
                <h2>MOVESET GUIDE</h2>
                <div id="moveset-content" style="text-align: left; padding: 10px;">
                    <!-- Moveset data injected here -->
                </div>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="hidden">
            <div class="loading-content">
                <h2>LOADING...</h2>
                <div class="steve-builder">
                    <div class="steve-sprite"></div>
                    <div class="block-stack">
                        <div class="mc-block hidden-block"></div>
                        <div class="mc-block hidden-block"></div>
                        <div class="mc-block hidden-block"></div>
                    </div>
                </div>
            </div>
        </div>

        <script src="js/assets.js"></script>
    <script src="js/textures.js"></script>
    <script src="js/video-cutscenes.js"></script>
    <script src="js/voxel.js"></script>
    <script src="js/models3d.js"></script>
    <script src="js/combat3d.js"></script>
    <script src="js/overworld3d.js"></script>
    <script src="js/main3d.js"></script>
</body>
</html>
